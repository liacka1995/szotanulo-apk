name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK using official python-for-android Docker image
        run: |
          docker pull ghcr.io/kivy/python-for-android:develop
          docker run --rm -v ${{ github.workspace }}:/app ghcr.io/kivy/python-for-android:develop \
            p4a apk \
              --private /app \
              --package=hu.szotanulo.ultra \
              --name "SzotanuloUltra" \
              --version 1.0 \
              --bootstrap=sdl2 \
              --requirements=python3,kivy \
              --arch armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SzotanuloUltra.apk
          path: "**/*.apk"
