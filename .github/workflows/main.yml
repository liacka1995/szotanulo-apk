name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install p4a GitHub Action
        uses: kivy/python-for-android-action@v1
        with:
          command: apk
          package: hu.szotanulo.ultra
          name: SzotanuloUltra
          version: "1.0"
          requirements: python3,kivy
          bootstrap: sdl2
          arch: armeabi-v7a
          private: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SzotanuloUltra.apk
          path: "**/*.apk"
