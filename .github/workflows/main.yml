name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools git zip openjdk-17-jdk unzip autoconf automake libtool

      - name: Install python-for-android
        run: |
          pip install "python-for-android<2024" cython

      - name: Build APK using python-for-android Docker image
        run: |
          docker pull kivy/python-for-android
          docker run --rm -v ${{ github.workspace }}:/app kivy/python-for-android \
            p4a apk \
              --private /app \
              --package=hu.szotanulo.ultra \
              --name "SzotanuloUltra" \
              --version 1.0 \
              --bootstrap=sdl2 \
              --requirements=python3,kivy \
              --arch armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SzotanuloUltra.apk
          path: "**/*.apk"
